version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chatbot_postgres
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    environment:
      # Application
      APP_NAME: "CORE AI Chatbot API"
      ENVIRONMENT: "development"
      DEBUG: "true"

      # Server
      HOST: "0.0.0.0"
      PORT: "8000"

      # Database
      DATABASE_URL: "postgresql+asyncpg://chatbot_user:chatbot_password@postgres:5432/chatbot_db"
      DATABASE_ECHO: "false"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "20"

      # Redis
      REDIS_URL: "redis://:redis_password@redis:6379/0"
      REDIS_PASSWORD: "redis_password"
      REDIS_DB: "0"

      # Mistral AI (provide your own key)
      MISTRAL_API_KEY: "${MISTRAL_API_KEY}"
      MISTRAL_MODEL: "mistral-small-latest"
      MISTRAL_MAX_TOKENS: "4096"
      MISTRAL_TEMPERATURE: "0.7"

      # Security
      SECRET_KEY: "your-secret-key-change-in-production-min-32-chars"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

      # Logging
      LOG_LEVEL: "INFO"
      LOG_FILE: "logs/app.log"

      # Rate Limiting
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      RATE_LIMIT_PER_HOUR: "1000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatbot_network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chatbot_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: chatbot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - chatbot_network
    restart: unless-stopped
    profiles:
      - production

  # Adminer - Database Management UI (Optional)
  adminer:
    image: adminer:latest
    container_name: chatbot_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - chatbot_network
    restart: unless-stopped
    profiles:
      - tools

  # Redis Commander - Redis Management UI (Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: chatbot_redis_commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379:0:redis_password"
    depends_on:
      - redis
    networks:
      - chatbot_network
    restart: unless-stopped
    profiles:
      - tools

  # Prometheus - Metrics Collection (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: chatbot_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - chatbot_network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana - Metrics Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: chatbot_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - chatbot_network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  chatbot_network:
    driver: bridge
    name: chatbot_network

volumes:
  postgres_data:
    name: chatbot_postgres_data
  redis_data:
    name: chatbot_redis_data
  backend_logs:
    name: chatbot_backend_logs
  prometheus_data:
    name: chatbot_prometheus_data
  grafana_data:
    name: chatbot_grafana_data
